name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7

      # No `scope:` here on purpose: setup-node writes a registry-wide auth
      # token, which keeps working if a package is ever published under a
      # different scope than the others.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Guard: the root package and every publishable library must carry the
      # release tag's version (e.g. v0.1.0). They ship in lockstep, so a
      # forgotten bump in one library would publish a broken dependency range.
      - name: Check versions match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const bad = [];
            if (root.version !== tag) bad.push(root.name + "@" + root.version);
            for (const dir of fs.readdirSync("libs")) {
              const pkg = JSON.parse(fs.readFileSync("libs/" + dir + "/package.json", "utf8"));
              if (pkg.private) continue;
              if (pkg.version !== tag) bad.push(pkg.name + "@" + pkg.version);
            }
            if (bad.length) {
              console.error("release tag is " + tag + " but these do not match: " + bad.join(", "));
              process.exit(1);
            }
            console.log("all publishable packages are at " + tag);
          ' "$tag"

      - run: npm test

      # Libraries first: the root CLI package depends on them by version range.
      #
      # Published one at a time, skipping versions already on the registry, so a
      # job that dies partway through (expired token, npm outage) can just be
      # re-run: `npm publish --workspaces` would abort on the first
      # already-published package with E403 and never reach the rest.
      - name: Publish libraries
        run: |
          for manifest in libs/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then
              echo "skip $name (private)"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            npm publish --workspace "$name"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip $name@$version (already published)"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
